# ===========================================================================
# App Factory - recommended role -> model bindings
# ===========================================================================
#
# A ready-to-paste starting point that assigns each pipeline role to the model
# best suited to it, balancing three things:
#
#   1. Role strength   - put the strongest programming model on the builder,
#                        the strongest long-context reasoner on the brain.
#   2. Usage economy   - straightforward, high-frequency roles (commander,
#                        optimizer, prompt engineer) run on fast, inexpensive
#                        models so budget is spent where it changes the output.
#   3. Resilience      - every quality-critical role has a fallback on a
#                        different vendor, so one outage does not stall a build.
#
# Every `model` value below is a PLACEHOLDER ("<...>"). App Factory never
# validates model ids, so fill in the exact model name your account can reach.
# Copy this file to config/models.toml (or pass --models) once edited.
#
# The seven providers below match the picker: GPT (openai), Gemini (google),
# Claude (anthropic), SpaceXAI (xai), DeepSeek (deepseek), Kimi (moonshot),
# GLM (zhipu). Swapping any seat is a one-line change here - no code edits.
# ---------------------------------------------------------------------------

# --- Providers -------------------------------------------------------------
# Each names a preset from config/providers.presets.toml (a saved wire-format
# + base_url) and the env var holding its key. Add or remove freely.

[provider.anthropic]
preset  = "anthropic"
api_key = "env:ANTHROPIC_API_KEY"

[provider.openai]
preset  = "openai"
api_key = "env:OPENAI_API_KEY"

[provider.google]
preset  = "google"
api_key = "env:GOOGLE_API_KEY"

[provider.deepseek]
preset  = "deepseek"
api_key = "env:DEEPSEEK_API_KEY"

[provider.moonshot]
preset  = "moonshot"
api_key = "env:MOONSHOT_API_KEY"

[provider.zhipu]
preset  = "zhipu"
api_key = "env:ZHIPU_API_KEY"

[provider.xai]
preset  = "xai"
api_key = "env:XAI_API_KEY"


# --- Role bindings ---------------------------------------------------------

# IMPLEMENTER - the builder. The only free-form role, and the one that decides
# whether the product is any good. Give it the strongest coding model you have.
# Claude leads on multi-file code generation; DeepSeek-Coder is a strong, cheap
# fallback; GPT is a capable third. structured MUST stay false.
[roles.implementer]
provider    = "anthropic"      # Claude
model       = "<claude-coding-model-id>"
temperature = 0.2
max_tokens  = 8000
structured  = false
fallback    = ["deepseek", "openai"]

# OBSERVER - the brain and memory. Authors the spec, adjudicates, and does the
# context throttling, so it wants the largest reliable context window and
# strong structured reasoning. Gemini's long context suits the memory role;
# GPT backs it up.
[roles.observer]
provider    = "google"         # Gemini
model       = "<gemini-pro-model-id>"
temperature = 0.1
max_tokens  = 4000
structured  = true
fallback    = ["openai"]

# QC - the gatekeeper. Rigorous correctness/security/spec-fidelity review as a
# strict JSON issue array. GPT is excellent at disciplined structured output;
# DeepSeek is a solid, economical fallback.
[roles.qc]
provider    = "openai"         # GPT
model       = "<gpt-reasoning-model-id>"
temperature = 0.0
max_tokens  = 3000
structured  = true
fallback    = ["deepseek"]

# DESIGN CRITIC - UX / structure review against a fixed rubric. Wants taste and
# breadth more than raw depth. Gemini is strong here; Grok (SpaceXAI) is a good
# second opinion on a different vendor.
[roles.design]
provider    = "google"         # Gemini
model       = "<gemini-flash-or-pro-model-id>"
temperature = 0.0
max_tokens  = 3000
structured  = true
fallback    = ["xai"]

# OPTIMIZER - rewrites plain intake into a clean brief. Straightforward
# transformation, run every intake, so economy matters. Kimi and DeepSeek are
# both capable and inexpensive.
[roles.optimizer]
provider    = "moonshot"       # Kimi
model       = "<kimi-model-id>"
temperature = 0.3
max_tokens  = 2000
structured  = true
fallback    = ["deepseek"]

# PROMPT ENGINEER - writes one short corrective rule on a gate failure. Small,
# targeted, low-frequency. A cheap fast model is the right call. GLM primary,
# Kimi fallback.
[roles.prompt_engineer]
provider    = "zhipu"          # GLM
model       = "<glm-model-id>"
temperature = 0.2
max_tokens  = 1500
structured  = true
fallback    = ["moonshot"]

# COMMANDER - the thin Window 1 wrapper (readiness pings, one-line summaries).
# Almost no reasoning; keep it cheap and fast. GLM is plenty; a local model is
# also fine here. No fallback needed - if it is down, Window 1 degrades to
# terse status strings and the pipeline keeps working.
[roles.commander]
provider    = "zhipu"          # GLM (or point at a local preset)
model       = "<glm-lite-model-id>"
temperature = 0.0
max_tokens  = 256
structured  = true
fallback    = []
