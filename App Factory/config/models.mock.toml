# App Factory - offline binding. No credentials, no network, no cost.
#
#     python3 run.py --models config/models.mock.toml
#
# Every role points at the built-in `mock` provider. That provider is not a
# stub: it returns schema-valid payloads for each role and emits a converging
# defect sequence (2 blockers, then 1, then none), so a mock run exercises the
# real gate, the real monotonic-progress check, the real rule writer, and
# writes a real build to disk.
#
# Use it to learn the three windows and to verify a change to the pipeline
# before spending a token. `base_url` and `api_key` are ignored for kind
# "mock" and are omitted here for that reason.

[provider.mock]
kind = "mock"


# ---------------------------------------------------------------------------
# Role bindings
#
# Same shape as config/models.toml so the two files can be diffed. `model` is
# an opaque label here; the mock provider echoes it back as telemetry and
# otherwise ignores it.
#
# Optional per-role pricing, used only to populate telemetry and the cost
# ceiling. Left out below because a mock run costs nothing:
#
#   cost_per_1k_prompt     = 0.0
#   cost_per_1k_completion = 0.0
# ---------------------------------------------------------------------------

[roles.commander]
provider    = "mock"
model       = "mock-commander"
temperature = 0.0
max_tokens  = 256
structured  = true
fallback    = []

[roles.optimizer]
provider    = "mock"
model       = "mock-optimizer"
temperature = 0.3
max_tokens  = 2000
structured  = true
fallback    = []

[roles.observer]
provider    = "mock"
model       = "mock-observer"
temperature = 0.1
max_tokens  = 4000
structured  = true
fallback    = []

# structured MUST stay false: the code writer's product is files on disk,
# emitted as <file> blocks, not JSON. Config loading rejects true here.
[roles.implementer]
provider    = "mock"
model       = "mock-implementer"
temperature = 0.2
max_tokens  = 8000
structured  = false
fallback    = []

[roles.qc]
provider    = "mock"
model       = "mock-qc"
temperature = 0.0
max_tokens  = 3000
structured  = true
fallback    = []

[roles.design]
provider    = "mock"
model       = "mock-design"
temperature = 0.0
max_tokens  = 3000
structured  = true
fallback    = []

[roles.prompt_engineer]
provider    = "mock"
model       = "mock-prompt-engineer"
temperature = 0.2
max_tokens  = 1500
structured  = true
fallback    = []
